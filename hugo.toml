baseURL = 'https://doc.calaos.fr'
title = 'Calaos Documentation'

theme = "hugo-theme-relearn"
metaDataFormat = "yaml"

# English is the default language
defaultContentLanguage = "en"
languageCode = 'en-us'

# Force to have /en/my-page and /fr/my-page routes, even for default language.
defaultContentLanguageInSubdir= true

[params]
  editURL = "https://github.com/calaos/doc-website/edit/master/content/${FilePath}"
  author.name = "Calaos Team"
  showVisitedLinks = true
  disableBreadcrumb = false
  # Keep links to folders, not to their index.html (permalink.gotmpl appends it by default).
  disableExplicitIndexURLs = true
  disableNextPrev = true
  disableLandingPageButton = false
  titleSeparator = "::"
  themeVariant = "calaos"
  # The logo already carries the site name.
  linkTitle = " "
  logo = { src = "/images/logo_header.png", layout = "sidebar-row" }

[outputs]
home = [ "html", "rss" ]

[Languages]

## English

[Languages.en]
title = "Calaos Documentation"
weight = 1
label = "English"

[[Languages.en.menu.shortcuts]]
pre = "<i class='fa-fw fas fa-arrow-up-right-from-square'></i> "
name = "Calaos Website"
identifier = "site"
url = "https://calaos.fr/en/"
weight = 10

[[Languages.en.menu.shortcuts]]
pre = "<i class='fa-fw fab fa-github'></i> "
name = "Github repo"
identifier = "ds"
url = "https://github.com/calaos/"
weight = 20

